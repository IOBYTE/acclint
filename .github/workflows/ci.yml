name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --error-exitcode=1 is the point of running cppcheck at all: without it
  # cppcheck prints its findings and exits 0, so the step can never fail.
  #
  # --inline-suppr matches acclint.windows.cppcheck, so a // cppcheck-suppress
  # comment works the same in CI as it does in the cppcheck GUI.
  #
  # --inconclusive is deliberately NOT used for the gating run: inconclusive
  # findings vary between cppcheck versions, and the two jobs run different
  # versions, so gating on them would make CI flaky rather than useful.
  #
  # No project specific suppressions: missingIncludeSystem is cppcheck noise
  # about system headers it was never given. If a finding needs suppressing,
  # prefer a // cppcheck-suppress comment at the site (--inline-suppr above)
  # so the reason lives next to the code rather than in this file.
  CPPCHECK_ARGS: >-
    --enable=warning,performance,portability
    --std=c++20
    --force
    --inline-suppr
    --suppress=missingIncludeSystem
    --error-exitcode=1

jobs:
  build-linux:
    name: Linux (gcc, valgrind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ cppcheck libpng-dev zlib1g-dev valgrind bats

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Static analysis (cppcheck)
        run: cppcheck $CPPCHECK_ARGS -i build -I . .

      - name: Run tests
        run: |
          cd test
          # Make acclint available in PATH for tests
          export PATH="${{ github.workspace }}/build:$PATH"
          bash testrunner.sh

      # test/*/test.bats writes <testname>.output next to the fixtures when
      # actual and expected differ. Those files are the only record of what
      # went wrong, so collect them when something fails.
      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-linux
          path: test/**/*.output
          if-no-files-found: ignore
          retention-days: 14

  sanitizers:
    name: Linux (ASan + UBSan corpus sweep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpng-dev zlib1g-dev

      # cmake/FindSanitizers.cmake is already wired into CMakeLists.txt via
      # add_sanitizers(acclint); these are the options it exposes.
      - name: Configure with sanitizers
        run: >-
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSANITIZE_ADDRESS=On
          -DSANITIZE_UNDEFINED=On
          -DCMAKE_CXX_FLAGS=-D_GLIBCXX_ASSERTIONS

      - name: Build
        run: cmake --build build-asan -- -j$(nproc)

      # The bats suites wrap every call in valgrind, which cannot run a
      # sanitizer-instrumented binary, so this job drives the same corpus
      # directly instead. Every .ac/.acc file under test/ is fed through the
      # read path and through each transform, since the transforms are where
      # unchecked indexes live.
      - name: Sweep the test corpus
        run: |
          acclint="$PWD/build-asan/acclint"
          tmp=$(mktemp -d)
          crashes=0
          runs=0

          # log_path keeps sanitizer reports in their own file instead of
          # mixing them into acclint's stderr, which on a warning-heavy model
          # can run to well over a thousand lines.
          export ASAN_OPTIONS=abort_on_error=0:exitcode=42:detect_leaks=1:log_path=$tmp/san
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:exitcode=42:log_path=$tmp/san

          crash_reason() {
              case "$1" in
                  42)  echo "sanitizer report" ;;
                  124) echo "timed out - hang or runaway loop" ;;
                  134) echo "SIGABRT - assertion or uncaught exception" ;;
                  139) echo "SIGSEGV" ;;
                  136) echo "SIGFPE" ;;
                  *)   echo "signal $(( $1 - 128 ))" ;;
              esac
          }

          while IFS= read -r -d '' f; do
              for args in "" \
                          "-o $tmp/o.ac" \
                          "-o $tmp/o.acc" \
                          "-v 11 -o $tmp/o.ac" \
                          "-v 12 -o $tmp/o.ac" \
                          "--splitMat -o $tmp/o.ac" \
                          "--splitSURF -o $tmp/o.ac" \
                          "--splitPolygon -o $tmp/o.ac" \
                          "--flatten -o $tmp/o.ac" \
                          "--combineTexture -o $tmp/o.ac" \
                          "--fixSurface2SidedOpaque -o $tmp/o.ac" \
                          "--fixOverlapping2SidedSurface -o $tmp/o.ac" \
                          "--dump surf" \
                          "-T $(dirname "$f")/textures" \
                          "-T $(dirname "$f")/textures -o $tmp/o.ac"; do
                  runs=$((runs + 1))
                  # Run through a nested shell so bash's own "Aborted" /
                  # "Segmentation fault" job-control line stays out of the
                  # log; it names this script rather than the bug. The nested
                  # shell still reports the child's death as 128+signal, so
                  # the check below is unaffected. $1 is deliberately
                  # unquoted so the argument string splits into flags.
                  #
                  # "|| rc=$?" is load bearing: GitHub runs this step with
                  # `bash -e`, and acclint exits 1 for any input that has
                  # errors. As a bare command that status would end the whole
                  # step at the first such file, before a single finding could
                  # be printed. Inside a || list the failure is handled, so -e
                  # does not fire.
                  #
                  # timeout(1) makes a hang a finding rather than a stalled
                  # job: the sweep otherwise has no way to notice a runaway
                  # loop, only a crash. The slowest legitimate invocation in
                  # the corpus measures 56ms, so 30s is ~500x headroom.
                  rc=0
                  timeout 30 \
                      bash -c '"$0" $1 "$2" > /dev/null 2> "$3"' \
                      "$acclint" "$args" "$f" "$tmp/err" 2>/dev/null || rc=$?

                  # acclint exits 1 for input that legitimately has errors,
                  # so only the sanitizer exit code, a timeout and death by
                  # signal count. 124 is timeout(1)'s own exit code and is
                  # below 128, so it needs testing separately.
                  if [ "$rc" -eq 42 ] || [ "$rc" -eq 124 ] || [ "$rc" -ge 128 ]; then
                      crashes=$((crashes + 1))
                      echo "::error::acclint $args $f  ->  rc=$rc ($(crash_reason $rc))"

                      for log in "$tmp"/san.*; do
                          [ -f "$log" ] || continue
                          echo "--- sanitizer report ---"
                          sed -e "s#$tmp#TMP#g" "$log" | head -40
                          rm -f "$log"
                      done

                      # The crash evidence sits at the END of acclint's stderr,
                      # after however many warnings the file produced, so take
                      # the tail. Taking the head just prints the first few
                      # warnings and says nothing about the crash.
                      echo "--- last lines of acclint stderr ---"
                      tail -15 "$tmp/err" | sed -e "s#$tmp#TMP#g"
                  fi
              done
          done < <(find test \( -name '*.ac' -o -name '*.acc' \) -print0)

          echo "$runs invocations, $crashes crashing"
          [ "$crashes" -eq 0 ]

  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies (vcpkg)
        run: |
          .\vcpkg\vcpkg.exe install zlib:x64-windows libpng:x64-windows

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release -- /m

      - name: Install cppcheck
        run: |
          curl.exe -L -o cppcheck-setup.msi "https://github.com/cppcheck-opensource/cppcheck/releases/download/2.21.0/cppcheck-2.21.0-x64-Setup.msi"
          msiexec /i cppcheck-setup.msi /qn INSTALLDIR="C:\cppcheck"
          echo "C:\cppcheck" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # bash, not PowerShell: PowerShell passes $env:CPPCHECK_ARGS as one
      # argument instead of splitting it into flags.
      - name: Static analysis (cppcheck)
        shell: bash
        run: cppcheck $CPPCHECK_ARGS -i build -i vcpkg -I . .

      - name: Install test dependencies (bats)
        run: npm install -g bats

      - name: Run tests
        shell: bash
        run: |
          cd test
          # Make acclint available in PATH for tests (Windows build output)
          export PATH="${{ github.workspace }}/build/Release:$PATH"
          bash testrunner.sh

      - name: Upload failing test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows
          path: test/**/*.output
          if-no-files-found: ignore
          retention-days: 14
